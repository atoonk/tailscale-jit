{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jitd.serviceAccountName" . }}
  labels:
    {{- include "jitd.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# jitd never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
