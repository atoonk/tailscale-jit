nameOverride: ""
fullnameOverride: ""

# jitd has no container image of its own. An init container downloads the
# release binary from GitHub, checks it against the release's SHA256SUMS, and
# the main container runs it from a shared emptyDir.
release:
  # GitHub repository the release comes from (owner/name).
  repository: atoonk/tailscale-jit
  # Release tag. Defaults to the chart's appVersion.
  version: ""
  # CPU architecture of the binary: amd64 or arm64. Pods are pinned to nodes
  # of this architecture.
  arch: amd64
  # sha256 of jitd-linux-<arch> for that release, from its SHA256SUMS. The
  # entries below match the chart's appVersion; change them together with
  # release.version.
  sha256:
    amd64: 527ebca8cd0f1955284935eb3776f099e764a3d394649ef9578992e389691ced
    arm64: e96f3016faac312da0c4bb144dc26968844be79898c41f41404d9365b5def667
  # Full download URL, for a mirror. Overrides repository, version and arch.
  url: ""

# Image for both containers: the init container needs wget and sha256sum, and
# jitd needs CA certificates. The binary itself is static.
image:
  repository: alpine
  tag: "3.22"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Tailnet hostname of jitd's node. People open http://<hostname>/.
hostname: jit
# Tag jitd's node runs as; used in the policy snippet.
tag: tag:jit
# Principals who manage approval flows and see every request: logins,
# group:, okta:, tag:. Include at least one login, so someone can still get
# in to fix a broken credential. Nobody is an admin if empty.
admins: []
# Serve HTTPS on :443 with a Tailscale certificate (needs HTTPS enabled for
# the tailnet).
https: false
# How often jitd expires access and removes Okta memberships.
expiryInterval: 30s
# Log tsnet's backend and every HTTP request.
verbose: false
# More jitd flags, e.g. ["-ts-api=https://api.tailscale.com"].
extraArgs: []

# Credentials, read from the environment. Any left out here can be pasted
# on jitd's Integrations page, which keeps them in its database on the data
# volume. An env file at /data/env, if you create one, overrides both.
#
# Keys jitd uses:
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET (or TS_API_KEY): Tailscale API
#   TS_AUTHKEY: joins the tailnet on first start (optional: without it, jitd
#     logs a login URL)
#   SLACK_BOT_TOKEN, SLACK_APP_TOKEN: Slack (optional)
#   OKTA_API_TOKEN, or OKTA_CLIENT_ID and OKTA_PRIVATE_KEY: Okta (optional)
#   GOOGLE_SERVICE_ACCOUNT_JSON: Google groups (optional), the JSON key file
credentials:
  # Name of an existing Secret holding the keys above. Recommended: create it
  # with your secrets tooling (External Secrets, Sealed Secrets, ...).
  existingSecret: ""
  # Or let the chart create a Secret from these values. Avoid in production:
  # the values end up in your Helm release and wherever you keep values files.
  values: {}

# Tailscale API access with a federated identity (workload identity
# federation) instead of an OAuth client secret: nothing to store. Create one
# under Settings -> Trust credentials -> OpenID Connect -> Custom issuer, with
# this cluster's OIDC issuer URL, subject
# system:serviceaccount:<namespace>:<service account> and the same scopes as
# the OAuth client (Devices -> Posture attributes: Write, Devices -> Core:
# Read, Policy file: Read), plus Auth Keys: Write with tag:jit to also join
# the tailnet without TS_AUTHKEY. jitd then exchanges its service account
# token, issued for `audience`, for Tailscale API tokens. Leave the credentials
# Secret without TS_OAUTH_CLIENT_SECRET / TS_API_KEY, which would win.
federatedIdentity:
  # The federated identity's client ID. Empty: not used.
  clientId: ""
  # The audience Tailscale expects: api.tailscale.com/<client ID>.
  audience: ""

# Plain (non-secret) environment variables, e.g.
#   OKTA_ORG_URL: https://example.okta.com
#   OKTA_GRANT_ALLOWLIST: jit-*
#   OKTA_READ_ALLOWLIST: jit-approvers
env: {}
# More env or envFrom entries, in Kubernetes form.
extraEnv: []
extraEnvFrom: []

# jitd keeps its node identity (tsnet-state) and its database (jit.db) here.
# Lose the volume and jitd joins the tailnet as a new machine, with no flows
# or history.
persistence:
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

initResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
