suite: storage and service account
templates:
  - templates/pvc.yaml
  - templates/serviceaccount.yaml
  - templates/secret.yaml
release:
  name: jitd
tests:
  - it: keeps the data claim when the release is uninstalled
    template: templates/pvc.yaml
    set:
      persistence.storageClass: standard
    asserts:
      - equal:
          path: metadata.name
          value: jitd-data
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.storageClassName
          value: standard

  - it: creates no claim with an existing one
    template: templates/pvc.yaml
    set:
      persistence.existingClaim: my-claim
    asserts:
      - hasDocuments:
          count: 0

  - it: creates no Secret by default
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a service account without a token
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
